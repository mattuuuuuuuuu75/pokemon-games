<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ポケモンすごろく">
    <meta name="theme-color" content="#0ea5e9">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
    <title>ポケモン すごろく だいぼうけん！</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: #0b1021;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(250, 204, 21, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 25%, rgba(56, 189, 248, 0.20) 0%, transparent 45%),
                radial-gradient(circle at 50% 85%, rgba(239, 68, 68, 0.16) 0%, transparent 50%);
            color: #fff;
            user-select: none;
        }

        .text-outline {
            text-shadow: -1.5px -1.5px 0 #000, 1.5px -1.5px 0 #000, -1.5px 1.5px 0 #000, 1.5px 1.5px 0 #000, 0 2px 5px rgba(0,0,0,0.9);
        }
        .text-outline-sm {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        @keyframes poyonHop {
            0%   { transform: translateY(0) scale(1); }
            35%  { transform: translateY(-20px) scale(1.25); }
            70%  { transform: translateY(2px) scale(0.92, 1.08); }
            100% { transform: translateY(0) scale(1); }
        }
        .token-hopping {
            animation: poyonHop 0.34s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 45 !important;
        }

        @keyframes activeTurnPulse {
            0%, 100% { box-shadow: 0 0 10px #fde047, inset 0 0 8px rgba(253, 224, 71, 0.35); transform: translateY(0); }
            50%      { box-shadow: 0 0 22px #38bdf8, inset 0 0 14px rgba(250, 204, 21, 0.65); transform: translateY(-2px); }
        }
        .turn-card-active { animation: activeTurnPulse 1.1s ease-in-out infinite; }

        @keyframes masterAuraGlow {
            0%, 100% { box-shadow: 0 0 16px #c084fc, 0 0 32px #f472b6, inset 0 0 12px rgba(250, 204, 21, 0.6); }
            50%      { box-shadow: 0 0 28px #fef08a, 0 0 48px #a855f7, inset 0 0 20px rgba(254, 240, 138, 0.9); }
        }
        .master-aura { animation: masterAuraGlow 0.75s ease-in-out infinite; }

        @keyframes bossPulse {
            0%, 100% { box-shadow: 0 0 10px rgba(239, 68, 68, 0.85), inset 0 0 10px rgba(220, 38, 38, 0.55); border-color: #ef4444; }
            50%      { box-shadow: 0 0 22px rgba(252, 165, 165, 1), inset 0 0 16px rgba(239, 68, 68, 0.9); border-color: #fde047; }
        }
        .tile-boss-gate { animation: bossPulse 1.3s infinite; }

        @keyframes goalShine {
            0%, 100% { box-shadow: 0 0 14px #fde047, inset 0 0 10px rgba(254, 240, 138, 0.6); border-color: #ffffff; }
            50%      { box-shadow: 0 0 28px #f59e0b, inset 0 0 20px rgba(255, 255, 255, 0.95); border-color: #fef08a; }
        }
        .tile-goal-glow { animation: goalShine 1.15s infinite; }

        @keyframes ballWobble {
            0%, 100% { transform: rotate(-10deg) scale(1); }
            50%      { transform: rotate(10deg) scale(1.05); }
        }
        .ball-wobble {
            animation: ballWobble 0.85s ease-in-out infinite;
            transform-origin: bottom center;
        }

        @keyframes spinFast {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        .pokeball-spinning { animation: spinFast 0.22s linear infinite; }
        .pokeball-idle { animation: spinFast 10s linear infinite; }

        @keyframes shakeScreen {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-7px, 4px); }
            50% { transform: translate(7px, -5px); }
            75% { transform: translate(-5px, -3px); }
        }
        .shake-hit { animation: shakeScreen 0.32s ease-out; }

        @keyframes popIn {
            0%   { transform: scale(0.35); opacity: 0; }
            50%  { transform: scale(1.06); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-cutin { animation: popIn 0.36s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        .manga-burst {
            background: repeating-conic-gradient(
                from 0deg,
                rgba(250, 204, 21, 0.13) 0deg 3deg,
                transparent 3deg 9deg
            );
        }
    </style>
</head>
<body class="relative w-screen h-[100dvh] overflow-hidden flex flex-col justify-between">

    <audio id="charVoiceAudio" preload="auto" playsinline class="hidden"></audio>
    <canvas id="fxCanvas" class="fixed inset-0 pointer-events-none z-40"></canvas>

    <!-- ==========================================================
         スタートがめん（ステップ1：にんずう ＆ ステップ2：ポケモンえらび）
    =========================================================== -->
    <div id="setupOverlay" class="fixed inset-0 z-50 bg-gradient-to-br from-slate-950 via-indigo-950/95 to-slate-950 flex flex-col justify-between p-3 sm:p-5 overflow-hidden">
        <div class="manga-burst absolute inset-0 pointer-events-none"></div>

        <!-- ステップ1：なんにんで あそぶ？ -->
        <div id="setupStep1" class="relative z-10 w-full h-full max-w-5xl mx-auto flex flex-col items-center justify-between py-1 sm:py-3">
            <div class="w-full flex items-center justify-between">
                <a href="../index.html" class="px-3 py-1.5 rounded-2xl bg-slate-800/90 border-2 border-yellow-400 text-yellow-200 font-black text-xs sm:text-sm flex items-center gap-1.5 active:scale-95">
                    <span>🏠</span><span>ゲーム いちらんへ</span>
                </a>
                <button onclick="toggleSoundMute()" class="sound-toggle-btn px-3 py-1.5 rounded-2xl bg-amber-900/90 border-2 border-yellow-400 text-yellow-100 font-black text-xs sm:text-sm flex items-center gap-1.5 active:scale-95">
                    <span>🔊</span><span>おと オン</span>
                </button>
            </div>

            <div class="flex flex-col items-center text-center">
                <div class="flex items-center justify-center gap-2 sm:gap-3 mb-2">
                    <img src="../assets/cards/leader_lucario.webp" alt="ルカリオ" class="w-14 h-14 sm:w-18 sm:h-18 rounded-2xl object-cover border-2 border-cyan-300 shadow-lg -rotate-6">
                    <img src="../assets/cards/leader_charizard.webp" alt="リザードン" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-2 border-orange-400 shadow-lg -rotate-3">
                    <img src="../assets/cards/leader_pikachu.webp" alt="ピカチュウ" class="w-20 h-20 sm:w-24 sm:h-24 rounded-3xl object-cover border-4 border-yellow-300 shadow-[0_0_28px_rgba(250,204,21,0.9)] z-10">
                    <img src="../assets/cards/leader_eevee.webp" alt="イーブイ" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-2 border-pink-300 shadow-lg rotate-3">
                    <img src="../assets/cards/leader_mew.webp" alt="ミュウ" class="w-14 h-14 sm:w-18 sm:h-18 rounded-2xl object-cover border-2 border-fuchsia-300 shadow-lg rotate-6">
                </div>
                <div class="inline-flex items-center gap-2 bg-gradient-to-r from-red-600 via-amber-500 to-yellow-400 text-black font-black text-xs sm:text-sm px-4 py-0.5 rounded-full border-2 border-white shadow mb-1">
                    <span>🔴 ポケモン わくわく ボードゲーム ⚡</span>
                </div>
                <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-yellow-200 via-amber-300 to-orange-500 drop-shadow-[0_4px_12px_rgba(250,204,21,0.5)]">
                    ポケモン すごろく だいぼうけん！
                </h1>
                <p class="mt-2 text-xl sm:text-3xl font-black text-white text-outline">
                    🙌 なんにんで あそぶ？
                </p>
            </div>

            <div id="countButtonsRow" class="w-full grid grid-cols-5 gap-2.5 sm:gap-4 max-w-4xl my-1"></div>

            <button onclick="goToCharSelectStep()" class="px-9 py-3 sm:py-4 rounded-3xl font-black text-lg sm:text-2xl text-black bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-400 border-4 border-white shadow-[0_0_30px_rgba(250,204,21,0.9)] active:scale-95 transition flex items-center gap-3">
                <img src="../assets/items/pokeball_roulette.webp" alt="" class="w-8 h-8 rounded-full object-cover pokeball-idle">
                <span>つぎへ！ すきな ポケモンを えらぼう！ ➡️</span>
            </button>
        </div>

        <!-- ステップ2：ポケモン えらび -->
        <div id="setupStep2" class="relative z-10 hidden w-full h-full max-w-6xl mx-auto flex flex-col justify-between gap-2 overflow-hidden">
            <div class="flex items-center justify-between gap-2 shrink-0">
                <button onclick="backToStep1()" class="px-3 py-1.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border-2 border-slate-500 text-slate-200 font-black text-xs sm:text-sm active:scale-95">
                    ◀ にんずうを かえる
                </button>
                <div id="charSelectPrompt" class="text-base sm:text-2xl font-black text-yellow-300 text-outline text-center truncate">
                    👇 1P の ポケモンを タッチして えらんでね！
                </div>
                <button id="startAdventureBtn" onclick="startBoardGame()" disabled class="px-5 py-2 rounded-2xl font-black text-sm sm:text-lg bg-slate-700 text-slate-400 border-2 border-slate-500 transition flex items-center gap-1.5 shrink-0">
                    <span>🚀 ぼうけん スタート！</span>
                </button>
            </div>

            <div id="setupPlayerSlots" class="grid grid-cols-3 gap-2 shrink-0"></div>
            <div id="setupCharGrid" class="flex-1 min-h-0 grid grid-cols-6 grid-rows-2 gap-2 sm:gap-2.5"></div>
        </div>
    </div>

    <!-- ==========================================================
         メインゲームがめん（100dvh 固定・スクロールなし）
    =========================================================== -->
    <header class="relative z-20 h-[12dvh] min-h-[66px] max-h-[92px] bg-gradient-to-r from-slate-950 via-indigo-950/85 to-slate-950 border-b-2 border-yellow-400 px-2 py-1 flex items-center gap-2 shrink-0">
        <div class="flex flex-col gap-1 shrink-0">
            <div class="flex items-center gap-1">
                <a href="../index.html" class="w-8 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 border border-yellow-400/70 flex items-center justify-center text-sm active:scale-95" title="いちらんへ">🏠</a>
                <button onclick="toggleSoundMute()" class="sound-toggle-btn w-8 h-7 rounded-lg bg-amber-900/90 border border-yellow-400 flex items-center justify-center text-sm active:scale-95" title="おと">🔊</button>
            </div>
            <button onclick="confirmRestartToSetup()" class="px-1.5 h-6 rounded-lg bg-red-950 hover:bg-red-900 border border-red-400 text-[10px] font-black text-red-200 active:scale-95">
                🔄 さいしょ
            </button>
        </div>

        <div id="topStatusGrid" class="flex-1 h-full grid grid-cols-3 gap-1.5 sm:gap-2 items-stretch"></div>
    </header>

    <!-- 中央：全45マスポケモン大冒険絵巻ボード -->
    <main id="boardStage" class="relative z-10 flex-1 min-h-0 w-full max-w-[1700px] mx-auto px-2 py-1.5 flex flex-col justify-between overflow-hidden">
        <div id="boardRowsContainer" class="w-full h-full grid grid-rows-5 gap-1.5"></div>
    </main>

    <!-- 下部：モンスターボールルーレット ＆ 実況バー -->
    <footer class="relative z-20 h-[14.5dvh] min-h-[82px] max-h-[112px] bg-gradient-to-r from-slate-950 via-red-950/75 to-slate-950 border-t-2 border-yellow-400 px-3 py-1.5 flex items-center justify-between gap-3 shrink-0">
        <div class="flex items-center gap-2.5 min-w-0 flex-1">
            <div id="footerTurnAvatarBox" class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-3 border-yellow-300 overflow-hidden shrink-0 shadow-lg bg-slate-800">
                <img id="footerTurnAvatar" src="../assets/cards/leader_pikachu.webp" alt="" class="w-full h-full object-cover">
                <span id="footerTurnBadge" class="absolute bottom-0 inset-x-0 bg-black/80 text-[10px] font-black text-center text-yellow-300">1P</span>
            </div>
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2 mb-0.5 flex-wrap">
                    <span id="footerTurnNamePill" class="px-2.5 py-0.5 rounded-full text-xs sm:text-sm font-black bg-amber-500 text-black shadow border border-white/60">
                        1P ピカチュウ の ばん！
                    </span>
                    <span id="footerBuffPill" class="hidden items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-black bg-gradient-to-r from-fuchsia-300 via-yellow-300 to-cyan-300 text-black border border-white animate-bounce">
                        <img src="../assets/items/masterball.webp" alt="" class="w-4 h-4 rounded-full object-cover">
                        <span id="footerBuffText">マスターボール モード！ 4・5・6 かくてい！</span>
                    </span>
                </div>
                <div id="footerMessage" class="text-sm sm:text-xl font-black text-yellow-200 text-outline truncate">
                    モンスターボール ルーレットを タッチして まわそう！
                </div>
            </div>
        </div>

        <div class="flex items-center gap-2.5 sm:gap-3 shrink-0">
            <div id="rouletteBox1" class="relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-slate-900 border-3 border-yellow-400 flex items-center justify-center overflow-hidden shadow-lg">
                <img id="ballWheel1" src="../assets/items/pokeball_roulette.webp" alt="" class="absolute inset-0 w-full h-full object-cover opacity-80 pokeball-idle">
                <span id="rouletteNum1" class="relative z-10 text-2xl sm:text-4xl font-black text-yellow-200 text-outline">?</span>
            </div>

            <div id="rouletteBox2" class="hidden relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-cyan-950 border-3 border-cyan-300 items-center justify-center overflow-hidden shadow-lg">
                <img id="ballWheel2" src="../assets/items/pokeball_roulette.webp" alt="" class="absolute inset-0 w-full h-full object-cover opacity-80 pokeball-idle">
                <span id="rouletteNum2" class="relative z-10 text-2xl sm:text-4xl font-black text-cyan-200 text-outline">?</span>
            </div>

            <button id="spinActionBtn" onclick="handleSpinButtonTap()" class="h-14 sm:h-16 px-5 sm:px-7 rounded-2xl font-black text-base sm:text-2xl text-black bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 hover:brightness-110 border-4 border-white shadow-[0_0_24px_rgba(250,204,21,0.9)] active:scale-95 transition flex items-center gap-2">
                <img id="spinBtnImg" src="../assets/items/pokeball_roulette.webp" alt="" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full object-cover border border-black/40 pokeball-idle">
                <span id="spinBtnLabel">ボールを まわす！</span>
            </button>
        </div>
    </footer>

    <!-- 全画面ワクワクギミック＆ポケモン登場モーダル -->
    <div id="gimmickModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6">
        <div id="gimmickCard" class="pop-cutin relative w-full max-w-3xl bg-gradient-to-b from-yellow-300 via-amber-400 to-red-600 p-1.5 rounded-3xl shadow-[0_0_65px_rgba(250,204,21,0.9)]">
            <div id="gimmickInner" class="manga-burst bg-slate-950 rounded-[22px] p-4 sm:p-6 text-center relative overflow-hidden"></div>
        </div>
    </div>

    <!-- 🏆 でんどういり表彰式モーダル -->
    <div id="finaleModal" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col justify-between p-3 sm:p-6 overflow-hidden">
        <img src="../assets/items/trophy_goal.webp" alt="" class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none">
        <div class="manga-burst absolute inset-0 pointer-events-none"></div>

        <div class="relative z-10 text-center shrink-0">
            <div class="inline-block bg-gradient-to-r from-yellow-200 via-amber-400 to-yellow-200 text-black font-black text-xs sm:text-base px-5 py-1 rounded-full shadow-lg animate-bounce">
                🎊 ポケモンリーグ でんどういり！ みんな よく がんばったね！！ 🎊
            </div>
            <h2 id="finaleHeadline" class="mt-1 text-2xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 via-amber-300 to-orange-400 drop-shadow">
                🏆 ポケモン すごろく ひょうしょうしき 🏆
            </h2>
        </div>

        <div id="finaleAwardsGrid" class="relative z-10 flex-1 min-h-0 max-w-6xl w-full mx-auto my-2 grid grid-cols-3 gap-3 items-stretch"></div>

        <div class="relative z-10 flex items-center justify-center gap-4 shrink-0">
            <button onclick="playAllFinaleVoices()" class="px-6 py-3 rounded-2xl font-black text-sm sm:text-lg bg-gradient-to-r from-cyan-300 to-sky-500 text-black border-2 border-white shadow-lg active:scale-95">
                🔊 みんなの ポケモンボイスを じゅんばんに きく！
            </button>
            <button onclick="restartFromFinale()" class="px-8 py-3 rounded-2xl font-black text-base sm:text-xl bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 text-black border-4 border-white shadow-xl active:scale-95">
                🔄 もういちど あそぶ！
            </button>
        </div>
    </div>

    <!-- リスタート確認モーダル -->
    <div id="restartModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-slate-900 border-4 border-yellow-400 rounded-3xl p-6 max-w-md w-full text-center space-y-4">
            <img src="../assets/items/pokeball_roulette.webp" alt="" class="w-20 h-20 mx-auto rounded-2xl object-cover border-2 border-yellow-300">
            <div class="text-xl sm:text-2xl font-black text-yellow-300">さいしょの がめんに もどる？</div>
            <div class="flex items-center gap-3 pt-2">
                <button onclick="closeRestartModal()" class="flex-1 py-3 rounded-2xl bg-slate-700 text-white font-black text-base sm:text-lg">つづける</button>
                <button onclick="doRestartGame()" class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-red-500 to-orange-500 text-white font-black text-base sm:text-lg border-2 border-yellow-200">もどる！</button>
            </div>
        </div>
    </div>

    <script>
        /* ==========================================================
           1. 選べる12ひきの 人気ポケモン定義（完全かんじゼロ！）
        ========================================================== */
        const PLAYABLE_CHARS = [
            { id: 'pikachu',   name: 'ピカチュウ', poseTag: '⚡ 10まんボルト！',   color: '#eab308', img: '../assets/cards/leader_pikachu.webp',   summonId: 1,  dexId: 25  },
            { id: 'charizard', name: 'リザードン', poseTag: '🔥 ブラストバーン！', color: '#ea580c', img: '../assets/cards/leader_charizard.webp', summonId: 2,  dexId: 6   },
            { id: 'eevee',     name: 'イーブイ',   poseTag: '🎀 とっておき！',     color: '#ec4899', img: '../assets/cards/leader_eevee.webp',     summonId: 3,  dexId: 133 },
            { id: 'mewtwo',    name: 'ミュウツー', poseTag: '🔮 サイコブレイク！', color: '#9333ea', img: '../assets/cards/leader_mewtwo.webp',    summonId: 4,  dexId: 150 },
            { id: 'mew',       name: 'ミュウ',     poseTag: '✨ ゆびをふる！',     color: '#f472b6', img: '../assets/cards/leader_mew.webp',       summonId: 5,  dexId: 151 },
            { id: 'lucario',   name: 'ルカリオ',   poseTag: '🌀 はどうだん！',     color: '#0284c7', img: '../assets/cards/leader_lucario.webp',   summonId: 31, dexId: 448 },
            { id: 'greninja',  name: 'ゲッコウガ', poseTag: '🥷 みずしゅりけん！', color: '#2563eb', img: '../assets/cards/leader_greninja.webp',  summonId: 42, dexId: 658 },
            { id: 'rayquaza',  name: 'レックウザ', poseTag: '☄️ てんくう！',       color: '#059669', img: '../assets/cards/leader_rayquaza.webp',  summonId: 28, dexId: 384 },
            { id: 'sylveon',   name: 'ニンフィア', poseTag: '💖 ムーンフォース！', color: '#db2777', img: '../assets/cards/leader_sylveon.webp',   summonId: 17, dexId: 700 },
            { id: 'gengar',    name: 'ゲンガー',   poseTag: '👻 シャドーボール！', color: '#7c3aed', img: '../assets/cards/leader_gengar.webp',    summonId: 7,  dexId: 94  },
            { id: 'mimikyu',   name: 'ミミッキュ', poseTag: '🧸 じゃれつく！',     color: '#d97706', img: '../assets/cards/leader_mimikyu.webp',   summonId: 46, dexId: 778 },
            { id: 'piplup',    name: 'ポッチャマ', poseTag: '🐧 バブルこうせん！', color: '#0ea5e9', img: '../assets/cards/leader_piplup.webp',    summonId: 33, dexId: 393 }
        ];

        /* ==========================================================
           2. 5つのぼうけんエリア ＆ 全45マス「オールポケモン絵巻」定義！
        ========================================================== */
        const AREAS = [

        const game = {
            soundOn: true,
            audioManifest: null,
            playerCount: 3,
            selectedChars: [null, null, null, null, null, null],
            activeSetupSlot: 0,
            players: [],

        const voiceEl = document.getElementById('charVoiceAudio');
        let audioCtx = null;
        let audioUnlocked = false;

        async function loadAudioManifest() {
            try {
                const res = await fetch('../assets/audio/manifest.json?v=' + Date.now());
                if (res.ok) game.audioManifest = await res.json();
            } catch (_) {}
        }

        function unlockAudio() {
            if (audioUnlocked) return;
            audioUnlocked = true;
            getCtx();
            if (voiceEl && !voiceEl.src) {
                voiceEl.src = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
                voiceEl.play().then(() => voiceEl.pause()).catch(() => {});
            }
        }
        window.addEventListener('pointerdown', unlockAudio, { once: true, passive: true });

        function getCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function toggleSoundMute() {
            unlockAudio();
            game.soundOn = !game.soundOn;
            if (!game.soundOn && voiceEl) voiceEl.pause();
            document.querySelectorAll('.sound-toggle-btn').forEach(btn => {
                btn.innerHTML = game.soundOn
                    ? (btn.textContent.includes('おと') ? '<span>🔊</span><span>おと オン</span>' : '🔊')
                    : (btn.textContent.includes('おと') ? '<span>🔇</span><span>おと オフ</span>' : '🔇');
            });
        }

        function playCharacterVoiceBySummonId(summonId, onEndedCallback = null, cryDexOverride = null) {
            if (!game.soundOn) {
                if (onEndedCallback) setTimeout(onEndedCallback, 300);
                return;
            }
            if (cryDexOverride) {
                voiceEl.onended = () => { if (onEndedCallback) onEndedCallback(); };
                voiceEl.src = `../assets/audio/cries/dex_${cryDexOverride}.mp3`;
                voiceEl.play().catch(() => { if (onEndedCallback) onEndedCallback(); });
                return;
            }
            if (!summonId) {
                if (onEndedCallback) setTimeout(onEndedCallback, 300);
                return;
            }
            const entry = game.audioManifest?.summon?.[String(summonId)];
            const sid = String(summonId).padStart(2, '0');
            const src = entry ? `../${entry.src}` : `../assets/audio/summon/${sid}.mp3`;
            const startSec = entry?.splitSec || 0;

            const startPlay = () => {
                try { voiceEl.currentTime = startSec > 0.05 ? startSec : 0; } catch (_) {}
                voiceEl.play().catch(() => { if (onEndedCallback) onEndedCallback(); });
            };
            voiceEl.onended = () => { if (onEndedCallback) onEndedCallback(); };
            voiceEl.src = src;
            if (startSec > 0.05) {
                voiceEl.addEventListener('loadedmetadata', startPlay, { once: true });
                voiceEl.load();
            } else {
                startPlay();
            }
        }

        function playPoyonSound(stepNum = 1) {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const scale = [330, 370, 415, 440, 494, 554, 587, 659, 740, 880];
            const baseFreq = scale[(stepNum - 1) % scale.length];
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(baseFreq * 0.72, now);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.45, now + 0.11);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.15, now + 0.20);
            gain.gain.setValueAtTime(0.30, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.23);
        }

        function playTickSound(high = false) {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(high ? 1020 : 700, now);
            gain.gain.setValueAtTime(0.18, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.055);
        }

        function playPuffSound() {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const bufferSize = ctx.sampleRate * 0.28;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.08));
            }
            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            const filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(950, ctx.currentTime);
            const gain = ctx.createGain();
            gain.gain.setValueAtTime(0.40, ctx.currentTime);
            noise.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
            noise.start();
        }

        function playStarChime() {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + i * 0.065);
                gain.gain.setValueAtTime(0.24, now + i * 0.065);
                gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.065 + 0.24);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now + i * 0.065); osc.stop(now + i * 0.065 + 0.25);
            });
        }

        function playHitPunchSound(combo = 1) {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(240 + combo * 24, now);
            osc.frequency.exponentialRampToValueAtTime(65, now + 0.12);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(now); osc.stop(now + 0.14);
        }

        function playVictoryFanfare() {
            if (!game.soundOn) return;
            const ctx = getCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            const notes = [
                [523.25, 0.0, 0.14], [659.25, 0.13, 0.14], [783.99, 0.26, 0.14],
                [1046.5, 0.40, 0.28], [880.0, 0.70, 0.16], [1046.5, 0.88, 0.60]
            ];
            notes.forEach(([f, d, dur]) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, now + d);
                gain.gain.setValueAtTime(0.30, now + d);
                gain.gain.exponentialRampToValueAtTime(0.001, now + d + dur);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(now + d); osc.stop(now + d + dur + 0.02);
            });
        }

        function selectPlayerCount(n) {
            unlockAudio();
            playPoyonSound(n);
            game.playerCount = n;
            renderStep1CountButtons();
        }

        function goToCharSelectStep() {
            unlockAudio();
            playStarChime();
            for (let i = game.playerCount; i < 6; i++) game.selectedChars[i] = null;
            const firstEmpty = game.selectedChars.slice(0, game.playerCount).findIndex(c => c === null);
            game.activeSetupSlot = firstEmpty !== -1 ? firstEmpty : 0;

            document.getElementById('setupStep1').classList.add('hidden');
            document.getElementById('setupStep2').classList.remove('hidden');
            renderCharSelectScreen();
        }

        function backToStep1() {
            playTickSound();
            document.getElementById('setupStep2').classList.add('hidden');
            document.getElementById('setupStep1').classList.remove('hidden');
            renderStep1CountButtons();
        }

        function setSetupActiveSlot(idx) {
            playTickSound(true);
            game.activeSetupSlot = idx;
            renderCharSelectScreen();
        }

        function pickCharForActiveSlot(charId) {
            unlockAudio();
            const takenBy = game.selectedChars.slice(0, game.playerCount).findIndex(c => c === charId);
            if (takenBy !== -1 && takenBy !== game.activeSetupSlot) {
                playTickSound(false);
                return;
            }
            const charObj = PLAYABLE_CHARS.find(c => c.id === charId);
            game.selectedChars[game.activeSetupSlot] = charId;

            playStarChime();
            playCharacterVoiceBySummonId(charObj.summonId);

            const nextEmpty = game.selectedChars.slice(0, game.playerCount).findIndex(c => c === null);
            if (nextEmpty !== -1) game.activeSetupSlot = nextEmpty;
            renderCharSelectScreen();
        }

        function renderCharSelectScreen() {
            const n = game.playerCount;
            const slotsEl = document.getElementById('setupPlayerSlots');
            slotsEl.className = `grid grid-cols-${n} gap-2 shrink-0`;

            slotsEl.innerHTML = Array.from({ length: n }, (_, idx) => {
                const cid = game.selectedChars[idx];
                const ch = PLAYABLE_CHARS.find(c => c.id === cid);
                const isSelecting = idx === game.activeSetupSlot;

                return `
                    <button onclick="setSetupActiveSlot(${idx})" class="relative rounded-2xl p-2 border-3 transition flex items-center gap-2 text-left overflow-hidden ${
                        isSelecting ? 'border-yellow-300 ring-4 ring-yellow-300/60 scale-[1.02]' : 'border-slate-600'
                    }" style="background: ${ch ? `linear-gradient(135deg, ${ch.color}dd, #0f172a)` : '#0f172a'};">
                        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-slate-800 border-2 border-white overflow-hidden shrink-0 flex items-center justify-center">
                            ${ch ? `<img src="${ch.img}" alt="" class="w-full h-full object-cover">` : '<span class="text-xl">🔴</span>'}
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="text-[10px] sm:text-xs font-black text-yellow-200">${idx + 1}P ${isSelecting ? '👈 えらぶ ばん！' : ''}</div>
                            <div class="text-sm sm:text-lg font-black text-white text-outline-sm truncate">
                                ${ch ? ch.name : 'タッチしてね'}
                            </div>
                        </div>
                    </button>
                `;
            }).join('');

            const allPicked = game.selectedChars.slice(0, n).every(c => c !== null);
            const promptEl = document.getElementById('charSelectPrompt');
            const startBtn = document.getElementById('startAdventureBtn');

            if (allPicked) {
                promptEl.textContent = '🎉 ぜんいん そろったよ！「ぼうけん スタート！」を タッチ！！';
                startBtn.disabled = false;
                startBtn.className = 'px-6 py-2 rounded-2xl font-black text-base sm:text-xl text-black bg-gradient-to-r from-yellow-300 via-amber-400 to-orange-500 border-4 border-white shadow-[0_0_25px_rgba(250,204,21,1)] animate-bounce cursor-pointer shrink-0';
            } else {
                promptEl.textContent = `👇 ${game.activeSetupSlot + 1}P の すきな ポケモンを タッチしてね！`;
                startBtn.disabled = true;
                startBtn.className = 'px-5 py-2 rounded-2xl font-black text-sm sm:text-lg bg-slate-800 text-slate-500 border-2 border-slate-700 shrink-0';
            }

            const gridEl = document.getElementById('setupCharGrid');
            gridEl.innerHTML = PLAYABLE_CHARS.map(ch => {
                const ownerIdx = game.selectedChars.slice(0, n).findIndex(c => c === ch.id);
                const isTaken = ownerIdx !== -1;
                return `
                    <button onclick="pickCharForActiveSlot('${ch.id}')" class="relative rounded-2xl overflow-hidden border-3 transition active:scale-95 flex flex-col justify-between group ${
                        isTaken ? 'border-yellow-300 shadow-[0_0_18px_rgba(250,204,21,0.85)]' : 'border-slate-600 hover:border-white'
                    }">
                        <img src="${ch.img}" alt="${ch.name}" class="absolute inset-0 w-full h-full object-cover ${isTaken ? 'brightness-110 scale-105' : 'group-hover:scale-105'} transition duration-200">

                            <span class="px-1.5 py-0.5 rounded-full text-[9px] sm:text-[11px] font-black text-white shadow" style="background:${ch.color}">${ch.poseTag}</span>
                        </div>
                        ${isTaken ? `
                            <div class="relative z-10 mx-auto bg-yellow-300 text-black font-black text-[10px] sm:text-xs px-2.5 py-0.5 rounded-full border-2 border-black shadow-lg animate-bounce">
                                ✨ ${ownerIdx + 1}P ゲット！
                            </div>
                        ` : '<div></div>'}
                        <div class="relative z-10 w-full py-1 px-1 text-center bg-gradient-to-t from-black via-black/85 to-transparent">
                            <span class="text-sm sm:text-lg font-black text-white text-outline-sm">${ch.name}</span>
                        </div>
                    </button>
                `;
            }).join('');
        }

        /* ==========================================================
           5. 全45マス「オールポケモン絵巻ボード」描画
        ========================================================== */
        function startBoardGame() {
            unlockAudio();
            playVictoryFanfare();

            game.players = game.selectedChars.slice(0, game.playerCount).map((cid, idx) => {
                const ch = PLAYABLE_CHARS.find(c => c.id === cid) || PLAYABLE_CHARS[idx];
                return {
                    id: idx,
                    label: `${idx + 1}P`,
                    char: ch,
                    tile: 1,
                    stars: 1,
                    doubleBall: false,
                    clearedGate15: false,
                    clearedGate30: false,
                    bossHp15: 8,
                    bossHp30: 10,
                    eventsCount: 0,
                    luckyScore: 0,
                    totalMoved: 0
                };
            });

            game.turnIdx = 0;
            document.getElementById('setupOverlay').classList.add('hidden');
            buildBoardDOMOnce();
            beginPlayerTurn();
        }

        function buildBoardDOMOnce() {
            const container = document.getElementById('boardRowsContainer');
            container.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                const area = AREAS[r];
                const isRightToLeft = (r % 2 === 1);
                const rowTiles = [];
                for (let c = 0; c < 9; c++) {
                    const tileNum = isRightToLeft ? (r * 9 + (9 - c)) : (r * 9 + c + 1);
                    rowTiles.push(tileNum);
                }

                const rowEl = document.createElement('div');
                rowEl.className = `relative rounded-2xl border-2 px-1.5 py-1 grid grid-cols-9 gap-1 sm:gap-1.5 items-stretch ${area.rowBg}`;
                const areaBadge = `<span class="absolute -top-2.5 left-3 z-30 ${area.badgeBg} text-[9px] sm:text-[10px] font-black px-2.5 py-0.2 rounded-full shadow border border-white/80 pointer-events-none">${area.name}</span>`;

                const cellsHtml = rowTiles.map(tileNum => {
                    const cellCfg = BOARD_MAP[tileNum];
                    const gBadge = GIMMICK_BADGES[cellCfg.type];
                    let dirArrow = '';
                    if (tileNum < 45) {
                        if (tileNum % 9 === 0) dirArrow = '▼';
                        else dirArrow = isRightToLeft ? '◀' : '▶';
                    } else {
                        dirArrow = '👑';
                    }

                    return `
                        <div id="tile-${tileNum}" class="relative rounded-xl border-2 ${gBadge.frameCls} bg-slate-900 flex flex-col justify-between overflow-visible shadow-md">
                            <div class="absolute inset-0 rounded-[10px] overflow-hidden pointer-events-none">
                                <img src="${cellCfg.img}" alt="${cellCfg.title}" class="w-full h-full object-cover brightness-95 contrast-105">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/15 to-black/40"></div>
                            </div>
                            <div class="relative z-10 flex items-start justify-between p-0.5 sm:p-1 leading-none pointer-events-none">
                                <span class="bg-black/85 text-yellow-200 border border-yellow-400/60 text-[8.5px] sm:text-[10px] font-black px-1 py-0.2 rounded shadow">
                                    ${tileNum}${dirArrow}
                                </span>
                                <span class="${gBadge.badgeCls} text-[8px] sm:text-[9.5px] font-black px-1 py-0.2 rounded shadow border border-black/30 tracking-tighter">
                                    ${gBadge.tag}
                                </span>
                            </div>
                            <div class="relative z-10 w-full px-0.5 pb-0.5 pt-2 text-center pointer-events-none">
                                <span class="block text-[8px] sm:text-[9.5px] font-black text-white text-outline-sm leading-none truncate tracking-tighter">
                                    ${cellCfg.title}
                                </span>
                            </div>
                            <div id="pieces-on-${tileNum}" class="absolute inset-0 z-20 p-0.5 pointer-events-none flex items-center justify-center"></div>
                        </div>
                    `;
                }).join('');

                rowEl.innerHTML = areaBadge + cellsHtml;
                container.appendChild(rowEl);
            }
        }

        function getPlayerRanks() {
            const sorted = [...game.players].sort((a, b) => (b.tile * 100 + b.stars) - (a.tile * 100 + a.stars));
            const rankMap = {};
            sorted.forEach((p, i) => { rankMap[p.id] = i + 1; });
            return rankMap;
        }

        function renderTopStatusAndPieces() {
            const n = game.players.length;
            const statusGrid = document.getElementById('topStatusGrid');
            statusGrid.className = `flex-1 h-full grid grid-cols-${n} gap-1.5 sm:gap-2 items-stretch`;
            const ranks = getPlayerRanks();

            statusGrid.innerHTML = game.players.map((p, idx) => {
                const isTurn = idx === game.turnIdx && game.phase !== 'finale';
                const isMaster = isTurn && game.currentMasterMode;

                return `
                    <div class="relative rounded-xl px-2 py-1 border-2 flex items-center gap-1.5 sm:gap-2 overflow-hidden transition ${
                        isTurn ? 'border-yellow-300 turn-card-active' : 'border-slate-700 opacity-90'
                    } ${isMaster ? 'master-aura' : ''}" style="background: linear-gradient(135deg, ${p.char.color}dd, #0f172a);">
                        <div class="relative w-10 h-10 sm:w-12 sm:h-12 rounded-xl border-2 border-white overflow-hidden shrink-0 bg-slate-900">
                            <img src="${isMaster ? '../assets/items/masterball.webp' : p.char.img}" alt="${p.char.name}" class="w-full h-full object-cover">
                            <span class="absolute top-0 left-0 bg-black/80 text-[8px] sm:text-[9px] font-black px-1 text-yellow-300">${p.label}</span>
                        </div>
                        <div class="min-w-0 flex-1 leading-tight">
                            <div class="flex items-center justify-between gap-1">
                                <span class="text-xs sm:text-sm font-black text-white text-outline-sm truncate">${p.char.name}</span>
                                <span class="text-[9px] sm:text-[11px] font-black bg-black/65 text-yellow-300 px-1.5 rounded-full shrink-0">
                                    ${ranks[p.id] === 1 ? '👑1い' : `${ranks[p.id]}い`}
                                </span>
                            </div>
                            <div class="flex items-center justify-between gap-1 mt-0.5 text-[10px] sm:text-xs font-black">
                                <span class="text-white bg-black/55 px-1.5 rounded">📍${p.tile}マス</span>
                                <span class="text-yellow-300 bg-black/55 px-1.5 rounded">⭐×${p.stars}</span>
                            </div>
                        </div>
                        ${p.doubleBall ? '<span class="absolute bottom-0.5 right-1 bg-cyan-300 text-black text-[8px] sm:text-[9px] font-black px-1 rounded-full border border-black animate-pulse">🔴×2</span>' : ''}
                    </div>
                `;
            }).join('');

            for (let t = 1; t <= 45; t++) {
                const holder = document.getElementById(`pieces-on-${t}`);
                if (!holder) continue;
                const here = game.players.filter(p => p.tile === t);
                if (here.length === 0) {
                    holder.innerHTML = '';
                    continue;
                }

                let layoutCls = 'flex items-center justify-center';
                let sizeCls = 'w-9 h-9 sm:w-11 sm:h-11';
                if (here.length === 2) {
                    layoutCls = 'flex items-center justify-center gap-1';
                    sizeCls = 'w-7 h-7 sm:w-8 sm:h-8';
                } else if (here.length >= 3) {
                    layoutCls = 'grid grid-cols-3 gap-0.5 place-items-center w-full h-full p-1';
                    sizeCls = 'w-5 h-5 sm:w-6 sm:h-6';
                }

                holder.className = `absolute inset-0 z-20 pointer-events-none ${layoutCls}`;
                holder.innerHTML = here.map(p => {
                    const isHopping = game.hoppingPlayerId === p.id;
                    const isCurrent = p.id === game.turnIdx;
                    const hopBadge = (isHopping && game.hopCountDisplay !== null)
                        ? `<div class="absolute -top-7 left-1/2 -translate-x-1/2 bg-yellow-300 text-black font-black text-sm sm:text-lg px-2.5 py-0.2 rounded-full border-2 border-black shadow-xl whitespace-nowrap z-50">${game.hopCountDisplay}！</div>`
                        : '';

                    return `
                        <div class="relative ${sizeCls} rounded-full border-3 shadow-[0_2px_10px_rgba(0,0,0,0.95)] transition-transform ${
                            isHopping ? 'token-hopping scale-115' : ''
                        } ${isCurrent ? 'ring-3 ring-yellow-300 z-30' : ''}" style="border-color:#ffffff; background:${p.char.color};">
                            ${hopBadge}
                            <img src="${p.char.img}" alt="${p.char.name}" class="w-full h-full rounded-full object-cover">
                            <span class="absolute -bottom-1 -right-1 text-white text-[7px] sm:text-[8px] font-black px-1 rounded-full border border-white leading-none shadow" style="background:${p.char.color}">${p.label}</span>
                            ${p.doubleBall ? '<span class="absolute -top-1.5 -left-1.5 bg-cyan-300 text-black text-[7px] font-black px-0.5 rounded-full border border-black">×2</span>' : ''}
                        </div>
                    `;
                }).join('');
            }
        }

        /* ==========================================================
           6. ターン開始 ＆ マスターボール逆転モード ＆ ルーレット
        ========================================================== */
        function beginPlayerTurn() {
            const p = game.players[game.turnIdx];
            game.phase = 'ready_spin';

            const maxTile = Math.max(...game.players.map(x => x.tile));
            game.currentMasterMode = (maxTile - p.tile >= 7);

            document.getElementById('footerTurnAvatar').src = game.currentMasterMode ? '../assets/items/masterball.webp' : p.char.img;
            document.getElementById('footerTurnBadge').textContent = p.label;
            const pill = document.getElementById('footerTurnNamePill');
            pill.textContent = `${p.label} ${p.char.name} の ばん！`;
            pill.style.backgroundColor = p.char.color;
            pill.style.color = '#fff';

            const buffPill = document.getElementById('footerBuffPill');
            const buffText = document.getElementById('footerBuffText');
            if (game.currentMasterMode && p.doubleBall) {
                buffText.textContent = 'マスターボール ＆ ダブルボール！！ 4・5・6 が 2こ！';
                buffPill.classList.remove('hidden');
                buffPill.classList.add('inline-flex');
            } else if (game.currentMasterMode) {
                buffText.textContent = 'マスターボール チャンス！ 4・5・6 かくてい！';
                buffPill.classList.remove('hidden');
                buffPill.classList.add('inline-flex');
            } else if (p.doubleBall) {
                buffText.textContent = 'ダブルボール！ ルーレット 2こ！';
                buffPill.classList.remove('hidden');
                buffPill.classList.add('inline-flex');
            } else {
                buffPill.classList.add('hidden');
                buffPill.classList.remove('inline-flex');
            }

            const box1 = document.getElementById('rouletteBox1');
            const box2 = document.getElementById('rouletteBox2');
            document.getElementById('rouletteNum1').textContent = '?';
            document.getElementById('ballWheel1').src = game.currentMasterMode ? '../assets/items/masterball.webp' : '../assets/items/pokeball_roulette.webp';
            box1.className = `relative w-14 h-14 sm:w-16 sm:h-16 rounded-2xl border-3 flex items-center justify-center overflow-hidden shadow-lg ${
                game.currentMasterMode ? 'bg-purple-900 border-yellow-300 master-aura' : 'bg-slate-900 border-yellow-400'
            }`;

            if (p.doubleBall) {
                box2.classList.remove('hidden');
                box2.classList.add('flex');
                document.getElementById('rouletteNum2').textContent = '?';
            } else {
                box2.classList.add('hidden');
                box2.classList.remove('flex');
            }

            const spinBtn = document.getElementById('spinActionBtn');
            spinBtn.disabled = false;
            document.getElementById('spinBtnLabel').textContent = 'ボールを まわす！';

            setFooterMessage(`${p.char.name} の ばんだよ！ モンスターボール ルーレットを タッチ！`);
            renderTopStatusAndPieces();

            if (game.currentMasterMode) showMasterBallCutin(p);
        }

        function setFooterMessage(msg) {
            document.getElementById('footerMessage').textContent = msg;
        }

        function showMasterBallCutin(player) {
            const modal = document.getElementById('gimmickModal');
            const inner = document.getElementById('gimmickInner');
            inner.innerHTML = `
                <div class="flex flex-col items-center gap-3 py-2">
                    <div class="inline-block bg-gradient-to-r from-fuchsia-400 via-yellow-300 to-cyan-300 text-black font-black text-xs sm:text-base px-5 py-1 rounded-full border-2 border-white animate-bounce">
                        🌈 だいぎゃくてん チャンス！！ 🌈
                    </div>
                    <div class="flex items-center justify-center gap-4">
                        <img src="../assets/items/masterball.webp" alt="マスターボール" class="w-32 h-32 sm:w-40 sm:h-40 rounded-3xl object-cover border-4 border-yellow-300 master-aura">
                        <div class="text-left max-w-sm space-y-2">
                            <div class="text-2xl sm:text-4xl font-black text-yellow-300 text-outline">マスターボール かくせい！！</div>
                            <div class="text-base sm:text-xl font-black text-white">
                                でんせつパワーが ${player.char.name} に ちからを かしてくれたぞ！！
                            </div>
                            <div class="bg-purple-600/40 border-2 border-yellow-300 rounded-2xl px-3 py-1.5 text-sm sm:text-lg font-black text-yellow-200">
                                ⚡ ルーレットが かならず「4・5・6」に パワーアップ！！
                            </div>
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
            playVictoryFanfare();
            playCharacterVoiceBySummonId(28);
            setTimeout(() => {
                if (game.phase === 'ready_spin') modal.classList.add('hidden');
            }, 2400);
        }

        function handleSpinButtonTap() {
            unlockAudio();
            if (game.phase === 'ready_spin') startSpinningRoulette();
            else if (game.phase === 'spinning') finalizeRouletteStop();
        }

        function startSpinningRoulette() {
            game.phase = 'spinning';
            document.getElementById('gimmickModal').classList.add('hidden');
            const p = game.players[game.turnIdx];
            const pool = game.currentMasterMode ? [4, 5, 6] : [1, 2, 3, 4, 5, 6];

            const w1 = document.getElementById('ballWheel1');
            const w2 = document.getElementById('ballWheel2');
            const btnImg = document.getElementById('spinBtnImg');
            [w1, btnImg].forEach(el => { el.classList.remove('pokeball-idle'); el.classList.add('pokeball-spinning'); });
            if (p.doubleBall) { w2.classList.remove('pokeball-idle'); w2.classList.add('pokeball-spinning'); }

            document.getElementById('spinBtnLabel').textContent = 'ストップ！！';
            setFooterMessage('🔴 モンスターボール かいてんちゅう！ タッチで ストップ！');

            let tickToggle = false;
            game.rouletteTimer = setInterval(() => {
                tickToggle = !tickToggle;
                playTickSound(tickToggle);
                document.getElementById('rouletteNum1').textContent = pool[Math.floor(Math.random() * pool.length)];
                if (p.doubleBall) {
                    document.getElementById('rouletteNum2').textContent = pool[Math.floor(Math.random() * pool.length)];
                }
            }, 65);

            game.autoStopTimer = setTimeout(() => {
                if (game.phase === 'spinning') finalizeRouletteStop();
            }, 1250);
        }

        function finalizeRouletteStop() {
            if (game.phase !== 'spinning') return;
            game.phase = 'moving';

            if (game.rouletteTimer) { clearInterval(game.rouletteTimer); game.rouletteTimer = null; }
            if (game.autoStopTimer) { clearTimeout(game.autoStopTimer); game.autoStopTimer = null; }

            ['ballWheel1', 'ballWheel2', 'spinBtnImg'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.remove('pokeball-spinning');
                el.classList.add('pokeball-idle');
            });

            const p = game.players[game.turnIdx];
            const pool = game.currentMasterMode ? [4, 5, 6] : [1, 2, 3, 4, 5, 6];
            const roll1 = pool[Math.floor(Math.random() * pool.length)];
            const roll2 = p.doubleBall ? pool[Math.floor(Math.random() * pool.length)] : 0;
            const totalSteps = roll1 + roll2;

            document.getElementById('rouletteNum1').textContent = roll1;
            if (p.doubleBall) {
                document.getElementById('rouletteNum2').textContent = roll2;
                p.doubleBall = false;
            }

            if (totalSteps >= 6) p.luckyScore += 2;
            else if (roll1 >= 5) p.luckyScore += 1;

            document.getElementById('spinActionBtn').disabled = true;
            document.getElementById('spinBtnLabel').textContent = `${totalSteps} すすむ！`;

            playStarChime();
            setFooterMessage(
                roll2 > 0
                    ? `✨ ${roll1} と ${roll2} で ごうけい「${totalSteps}」！ いっしょに かぞえよう！`
                    : `✨「${totalSteps}」が でたよ！ いっしょに かぞえよう！`
            );

            setTimeout(() => hopPlayerSteps(p, totalSteps, 1, true), 520);
        }

        /* ==========================================================
           7. ポヨン！ポヨン！ジャンプ移動 ＆ 関門ストップ
        ========================================================== */
        function hopPlayerSteps(player, stepsRemaining, dir = 1, triggerTileEventAfter = true) {
            if (stepsRemaining <= 0) {
                game.hoppingPlayerId = null;
                game.hopCountDisplay = null;
                renderTopStatusAndPieces();
                if (player.tile >= 45) {
                    triggerGrandFinale(player);
                } else if (triggerTileEventAfter) {
                    setTimeout(() => triggerLandedTileGimmick(player), 300);
                } else {
                    setTimeout(() => advanceToNextTurn(), 500);
                }
                return;
            }

            const totalPlanned = (player._hopStepIdx || 0) + 1;
            player._hopStepIdx = totalPlanned;

            player.tile = Math.max(1, Math.min(45, player.tile + dir));
            if (dir > 0) player.totalMoved += 1;

            game.hoppingPlayerId = player.id;
            game.hopCountDisplay = totalPlanned;
            playPoyonSound(totalPlanned);
            renderTopStatusAndPieces();

            if (player.tile >= 45) {
                player._hopStepIdx = 0;
                setTimeout(() => {
                    game.hoppingPlayerId = null;
                    game.hopCountDisplay = null;
                    renderTopStatusAndPieces();
                    triggerGrandFinale(player);
                }, 420);
                return;
            }

            if (dir > 0 && player.tile === 15 && !player.clearedGate15) {
                player._hopStepIdx = 0;
                setFooterMessage('🚀 ストップ！！ ロケットだんの ききゅうが あらわれた！！');
                setTimeout(() => {
                    game.hoppingPlayerId = null;
                    game.hopCountDisplay = null;
                    renderTopStatusAndPieces();
                    openBossGateBattle(player, 15);
                }, 480);
                return;
            }
            if (dir > 0 && player.tile === 30 && !player.clearedGate30) {
                player._hopStepIdx = 0;
                setFooterMessage('🔮 ストップ！！ さいきょう ミュウツーが たちふさがった！！');
                setTimeout(() => {
                    game.hoppingPlayerId = null;
                    game.hopCountDisplay = null;
                    renderTopStatusAndPieces();
                    openBossGateBattle(player, 30);
                }, 480);
                return;
            }

            setTimeout(() => {
                if (stepsRemaining - 1 <= 0) player._hopStepIdx = 0;
                hopPlayerSteps(player, stepsRemaining - 1, dir, triggerTileEventAfter);
            }, 360);
        }

        function advanceToNextTurn() {
            document.getElementById('gimmickModal').classList.add('hidden');
            game.turnIdx = (game.turnIdx + 1) % game.players.length;
            beginPlayerTurn();
        }

        /* ==========================================================
           8. 全10種 ポケモン世界観ワクワクギミック！
        ========================================================== */
        function triggerLandedTileGimmick(player) {
            game.phase = 'event';
            const cell = BOARD_MAP[player.tile];
            if (!cell) { advanceToNextTurn(); return; }

            switch (cell.type) {
                case 'star1':   openAllyStarEvent(player, cell, 1); break;
                case 'star2':   openAllyStarEvent(player, cell, 2); break;
                case 'boss1':   if (!player.clearedGate15) openBossGateBattle(player, 15); else openAllyStarEvent(player, cell, 1); break;
                case 'boss2':   if (!player.clearedGate30) openBossGateBattle(player, 30); else openAllyStarEvent(player, cell, 1); break;
                case 'thunder': player.eventsCount++; openThunderMashEvent(player, cell); break;
                case 'balls':   player.eventsCount++; openThreeBallsEvent(player, cell); break;
                case 'raid':    player.eventsCount++; openCoopRaidEvent(cell); break;
                case 'swap':    player.eventsCount++; openDittoSwapEvent(player, cell); break;
                case 'ride':    player.eventsCount++; openPokemonRideEvent(player, cell); break;
                case 'double':  player.eventsCount++; openDoubleBallEvent(player, cell); break;
                case 'heal':    player.eventsCount++; openPokecenterHealEvent(player, cell); break;
                case 'trap':    openTrapEvent(player, cell, cell.back || 1); break;
                default:        advanceToNextTurn(); break;
            }
        }

        function openAllyStarEvent(player, cell, count) {
            player.stars += count;
            const modal = document.getElementById('gimmickModal');
            const inner = document.getElementById('gimmickInner');
            modal.classList.remove('hidden');
            playStarChime();
            playCharacterVoiceBySummonId(cell.voiceId, null, cell.cryDex);
            spawnConfettiBurst(28);
            renderTopStatusAndPieces();

            inner.innerHTML = `
                <div class="flex items-center justify-center gap-4 py-3">
                    <img src="${cell.img}" alt="${cell.title}" class="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl object-cover border-4 border-yellow-300 shadow-2xl">
                    <img src="../assets/items/berries.webp" alt="" class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl object-cover border-3 border-amber-400 shadow-xl">
                </div>

            game.phase = 'event';

            function renderBossUI() {
                const pct = Math.max(0, Math.round((hp / maxHp) * 100));
                inner.innerHTML = `

                        <div class="inline-block bg-red-600 text-white font-black text-xs sm:text-sm px-4 py-1 rounded-full animate-pulse">

                                    <div class="h-full bg-gradient-to-r from-red-600 via-amber-500 to-yellow-300 transition-all duration-100" style="width:${pct}%"></div>
                                </div>
                            </div>
                        </div>
                        <button id="bossAttackBtn" class="w-full py-4 sm:py-5 rounded-3xl font-black text-2xl sm:text-3xl text-black bg-gradient-to-r from-yellow-300 via-amber-400 to-red-500 border-4 border-white shadow-[0_0_30px_rgba(250,204,21,0.95)] active:scale-95 flex items-center justify-center gap-3">

                        </button>
                    </div>
                `;
                document.getElementById('bossAttackBtn').onpointerdown = () => {
                    if (finished) return;
                    hp = Math.max(0, hp - 1);

                    if (bImg) { bImg.classList.remove('shake-hit'); void bImg.offsetWidth; bImg.classList.add('shake-hit'); }
                    if (hp <= 0) finishBossBattle(true);
                    else renderBossUI();
                };
            }

            const timer = setInterval(() => {
                if (finished) return;
                timeLeft = Math.max(0, timeLeft - 0.1);
                if (timeLeft <= 0) finishBossBattle(hp <= 0);
                else renderBossUI();
            }, 100);

            function finishBossBattle(won) {
                if (finished) return;
                finished = true;
                clearInterval(timer);

                if (won) {
                    if (isGate15) player.clearedGate15 = true;
                    else player.clearedGate30 = true;
                    player.stars += 3;
                    playVictoryFanfare();
                    spawnConfettiBurst(60);
                    renderTopStatusAndPieces();

                        </div>
                    `;
                    setTimeout(() => advanceToNextTurn(), 2100);
                } else {
                    const remain = Math.max(1, hp);
                    if (isGate15) player.bossHp15 = remain;
                    else player.bossHp30 = remain;
                    player.stars += 1;
                    playStarChime();
                    renderTopStatusAndPieces();
                    inner.innerHTML = `

                            <img src="${cell.img}" alt="" class="w-24 h-24 mx-auto rounded-3xl object-cover border-2 border-yellow-400">

                        </div>
                    `;
                    setTimeout(() => advanceToNextTurn(), 2000);
                }
            }
            renderBossUI();
        }

                inner.innerHTML = `

                            ${targets.map(t => `
                                <button data-tid="${t.id}" class="raid-target-btn h-16 sm:h-20 rounded-2xl border-3 overflow-hidden relative flex items-center justify-center transition ${
                                    t.hit ? 'bg-slate-900 border-slate-800 opacity-30 scale-75' : 'border-white shadow-lg active:scale-90'

                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                    btn.onpointerdown = (e) => {
                        e.preventDefault();
                        if (ended) return;
                        const tid = Number(btn.getAttribute('data-tid'));
                        if (!targets[tid].hit) {
                            targets[tid].hit = true;
                            broken++;
                            playHitPunchSound(broken);
                            if (broken >= totalTargets) finishRaid(true);
                            else renderRaidArena();
                        }
                    };
                });
            }

            const timer = setInterval(() => {
                if (ended) return;
                timeLeft = Math.max(0, timeLeft - 0.1);
                if (timeLeft <= 0) finishRaid(broken >= totalTargets);
                else renderRaidArena();
            }, 100);

                if (ended) return;
                ended = true;
                clearInterval(timer);
                const reward = perfect ? 2 : 1;
                game.players.forEach(p => { p.stars += reward; p.eventsCount++; });
                playVictoryFanfare();
                spawnConfettiBurst(60);
                renderTopStatusAndPieces();

                inner.innerHTML = `

                        </div>
                    </div>
                `;
                setTimeout(() => advanceToNextTurn(), 2100);
            }
            renderRaidArena();
        }

                        <img src="../assets/items/explosion_trap.webp" alt="ハプニング" class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl object-cover border-3 border-amber-300 shadow-xl">
                    </div>
                    <div class="text-2xl sm:text-4xl font-black text-purple-300 text-outline">💥 ${cell.title}！！</div>
                    <div class="text-lg sm:text-2xl font-black text-white">${cell.msg || `びっくりして ${backSteps} マス もどるよ！`}</div>
                </div>
            `;
            setTimeout(() => {
                modal.classList.add('hidden');
                hopPlayerSteps(player, backSteps, -1, false);
            }, 1950);
        }

        /* ==========================================================
           9. 🏆 でんどういり表彰式フィナーレ
        ========================================================== */
        function triggerGrandFinale(goalPlayer) {
            game.phase = 'finale';
            document.getElementById('gimmickModal').classList.add('hidden');
            playVictoryFanfare();
            spawnConfettiBurst(120);

            const assigned = new Map();
            assigned.set(goalPlayer.id, { badge: '👑 チャンピオン ゴールしょう', desc: 'いちばん のりで でんどういり ゴール！' });

            const others = game.players.filter(p => p.id !== goalPlayer.id);
            if (others.length > 0) {
                const topStar = [...others].sort((a, b) => b.stars - a.stars)[0];
                assigned.set(topStar.id, { badge: '⭐ スター マスターしょう', desc: `スターを ${topStar.stars} こも ゲットしたよ！` });
            }
            const rem1 = others.filter(p => !assigned.has(p.id));
            if (rem1.length > 0) {
                const topEv = [...rem1].sort((a, b) => b.eventsCount - a.eventsCount)[0];
                assigned.set(topEv.id, { badge: '🔥 バトル かつやくしょう', desc: 'イベントや バトルで だいかつやく！' });
            }
            const rem2 = others.filter(p => !assigned.has(p.id));
            if (rem2.length > 0) {
                const topLuck = [...rem2].sort((a, b) => b.luckyScore - a.luckyScore)[0];
                assigned.set(topLuck.id, { badge: '🍀 ミラクル ゲットしょう', desc: 'きらきら ラッキーの もちぬし！' });
            }
            const rem3 = others.filter(p => !assigned.has(p.id));
            if (rem3.length > 0) {
                const topMove = [...rem3].sort((a, b) => b.totalMoved - a.totalMoved)[0];
                assigned.set(topMove.id, { badge: '⚡ でんこうせっか しょう', desc: 'げんき いっぱい たくさん すすんだよ！' });
            }
            others.filter(p => !assigned.has(p.id)).forEach(p => {
                assigned.set(p.id, { badge: '💖 なかよし トレーナーしょう', desc: 'さいごまで ポケモンと がんばったね！' });
            });

            document.getElementById('finaleHeadline').textContent = `🏆 ${goalPlayer.label} ${goalPlayer.char.name} でんどういり おめでとう！！ 🏆`;

            const n = game.players.length;
            const grid = document.getElementById('finaleAwardsGrid');
            grid.className = `relative z-10 flex-1 min-h-0 max-w-6xl w-full mx-auto my-2 grid ${n <= 3 ? `grid-cols-${n}` : 'grid-cols-3 grid-rows-2'} gap-3 items-stretch`;

            const displayOrder = [goalPlayer, ...others];
            grid.innerHTML = displayOrder.map(p => {
                const aw = assigned.get(p.id);
                const isWinner = p.id === goalPlayer.id;
                return `
                    <div class="relative rounded-3xl p-1 bg-gradient-to-br ${
                        isWinner ? 'from-yellow-200 via-amber-400 to-orange-500 shadow-[0_0_30px_rgba(250,204,21,0.9)]' : 'from-cyan-300 via-sky-400 to-purple-500'
                    } flex">
                        <div class="w-full bg-slate-950/95 rounded-[20px] p-3 flex flex-col items-center justify-between text-center">
                            <span class="px-3 py-0.5 rounded-full text-xs sm:text-sm font-black ${
                                isWinner ? 'bg-yellow-300 text-black' : 'bg-amber-300 text-black'
                            } shadow">${aw.badge}</span>
                            <div class="flex items-center gap-3 my-1">
                                <img src="${p.char.img}" alt="${p.char.name}" class="w-16 h-16 sm:w-20 sm:h-20 rounded-2xl object-cover border-3" style="border-color:${p.char.color}">
                                <div class="text-left">
                                    <div class="text-xs font-black text-yellow-300">${p.label}（⭐×${p.stars} / 📍${p.tile}マス）</div>
                                    <div class="text-lg sm:text-2xl font-black text-white">${p.char.name}</div>
                                    <div class="text-[11px] sm:text-xs font-bold text-slate-300">${aw.desc}</div>
                                </div>
                            </div>
                            <button onclick="playCharacterVoiceBySummonId(${p.char.summonId})" class="w-full py-1.5 rounded-xl font-black text-xs sm:text-sm text-white border border-white/50 active:scale-95" style="background:${p.char.color}">
                                🔊 ${p.char.name} の ボイスを きく！
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('finaleModal').classList.remove('hidden');
            setTimeout(() => playCharacterVoiceBySummonId(goalPlayer.char.summonId), 650);
        }

        function playAllFinaleVoices() {
            unlockAudio();
            let i = 0;
            const list = [...game.players];
            function nextVoice() {
                if (i >= list.length || game.phase !== 'finale') return;
                const p = list[i++];
                spawnConfettiBurst(25);
                playCharacterVoiceBySummonId(p.char.summonId, () => setTimeout(nextVoice, 350));
            }
            nextVoice();
        }

        function restartFromFinale() {
            document.getElementById('finaleModal').classList.add('hidden');
            doRestartGame();
        }
        function confirmRestartToSetup() {
            document.getElementById('restartModal').classList.remove('hidden');
        }
        function closeRestartModal() {
            document.getElementById('restartModal').classList.add('hidden');
        }
        function doRestartGame() {
            closeRestartModal();
            if (voiceEl) voiceEl.pause();
            game.phase = 'setup';
            document.getElementById('setupOverlay').classList.remove('hidden');
            backToStep1();
        }

        /* ==========================================================
           10. 紙吹雪キャンバス
        ========================================================== */
        const fxCanvas = document.getElementById('fxCanvas');
        const fxCtx = fxCanvas.getContext('2d');
        let confetti = [];

        function resizeFxCanvas() {
            fxCanvas.width = window.innerWidth;
            fxCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeFxCanvas);

        function spawnConfettiBurst(count = 40) {
            const colors = ['#fde047', '#fb923c', '#ef4444', '#38bdf8', '#c084fc', '#34d399'];
            for (let i = 0; i < count; i++) {
                confetti.push({
                    x: window.innerWidth * (0.2 + Math.random() * 0.6),
                    y: window.innerHeight * (0.2 + Math.random() * 0.35),
                    vx: (Math.random() - 0.5) * 11,
                    vy: -Math.random() * 9 - 2,
                    size: Math.random() * 8 + 5,
                    rot: Math.random() * Math.PI * 2,
                    vrot: (Math.random() - 0.5) * 0.25,
                    alpha: 1,
                    color: colors[Math.floor(Math.random() * colors.length)]
                });
            }
        }

        function animateFx() {
            fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
            for (let i = confetti.length - 1; i >= 0; i--) {
                const c = confetti[i];
                c.x += c.vx; c.y += c.vy; c.vy += 0.22; c.rot += c.vrot; c.alpha -= 0.012;
                if (c.alpha <= 0 || c.y > fxCanvas.height + 30) { confetti.splice(i, 1); continue; }
                fxCtx.save();
                fxCtx.globalAlpha = c.alpha;
                fxCtx.translate(c.x, c.y);
                fxCtx.rotate(c.rot);
                fxCtx.fillStyle = c.color;
                fxCtx.fillRect(-c.size / 2, -c.size / 2, c.size, c.size * 0.65);
                fxCtx.restore();
            }
            requestAnimationFrame(animateFx);
        }

        window.addEventListener('DOMContentLoaded', async () => {
            resizeFxCanvas();
            renderStep1CountButtons();
            animateFx();
            await loadAudioManifest();
        });
    </script>
</body>
